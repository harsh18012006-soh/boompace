<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="BoomPace"/>
  <meta name="theme-color" content="#10141a"/>
  <title>BoomPace • Acoustic Interval Timer</title>

  <link rel="manifest" href="./manifest.json"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#10141a",
            "surface-low": "#181c22",
            "surface-container": "#1c2026",
            "surface-high": "#262a31",
            "surface-highest": "#31353c",
            "primary-container": "#c3f400",
            "on-primary": "#161e00",
            "secondary-container": "#ff571a",
            "on-surface-variant": "#c4c9ac"
          },
          fontFamily: {
            "headline": ["Space Grotesk", "sans-serif"],
            "mono-timer": ["JetBrains Mono", "monospace"],
            "body": ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #10141a;
      color: #dfe2eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    .pb-safe { padding-bottom: max(env(safe-area-inset-bottom, 0px), 16px); }
    .pt-safe { padding-top: max(env(safe-area-inset-top, 0px), 8px); }
    @keyframes strobe { 0%, 100% { opacity: 0; } 50% { opacity: 0.85; } }
    .strobe-flash { animation: strobe 0.35s ease-in-out 4; }
  </style>
</head>

<body class="bg-surface antialiased flex flex-col min-h-screen">

  <!-- Native Background Media Anchor -->
  <audio id="native-audio-anchor" loop preload="auto"></audio>

  <!-- Flash Screen Strobe -->
  <div id="flash-overlay" class="fixed inset-0 pointer-events-none z-[100] bg-secondary-container opacity-0 transition-opacity"></div>

  <!-- Header -->
  <header class="w-full z-40 bg-surface/95 backdrop-blur-md border-b border-surface-high px-4 py-3 flex items-center justify-between sticky top-0 pt-safe">
    <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTab('active-workout')">
      <div class="w-8 h-8 rounded-lg bg-primary-container flex items-center justify-center font-black text-on-primary text-sm shadow">
        BP
      </div>
      <div>
        <h1 class="text-sm font-bold uppercase tracking-tight text-white leading-none">BoomPace</h1>
        <span id="header-state" class="text-[10px] uppercase font-mono text-primary-container font-semibold">Active Workout</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <div id="lockscreen-pill" class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-high border border-primary-container/30 text-primary-container text-[10px] font-mono font-bold">
        <span class="w-1.5 h-1.5 rounded-full bg-primary-container animate-pulse"></span>
        <span id="lockscreen-text">LOCK-ACTIVE</span>
      </div>
      <button onclick="navigateTab('install-hub')" class="w-8 h-8 rounded-full bg-surface-high border border-surface-highest flex items-center justify-center text-white active:scale-90 transition-transform">
        <span class="material-symbols-outlined text-[18px]">qr_code_2</span>
      </button>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="flex-1 flex flex-col w-full px-4 pt-3 pb-24 max-w-lg mx-auto">

    <!-- TAB 1: ACTIVE WORKOUT -->
    <section id="tab-active-workout" class="tab-pane flex flex-col gap-3.5">
      <div class="bg-surface-low rounded-xl p-4 border border-surface-high shadow-xl flex flex-col items-center relative overflow-hidden">
        <div class="w-full flex items-center justify-between text-xs font-mono text-on-surface-variant pb-1">
          <span class="flex items-center gap-1.5 text-primary-container font-bold" id="hud-interval-badge">
            <span class="w-2 h-2 rounded-full bg-primary-container animate-ping"></span>
            INTERVAL 1 OF 10
          </span>
          <span id="hud-total-cap" class="bg-surface-container px-2 py-0.5 rounded border border-surface-high text-white font-bold">10:00 CAP</span>
        </div>

        <div class="relative w-60 h-60 flex items-center justify-center my-1">
          <svg class="w-full h-full -rotate-90" viewBox="0 0 200 200">
            <circle cx="100" cy="100" r="90" fill="none" stroke="#262a31" stroke-width="6"/>
            <circle id="session-ring" cx="100" cy="100" r="90" fill="none" stroke="#c3f400" stroke-width="6" stroke-dasharray="565.48" stroke-dashoffset="0" class="opacity-40 transition-all duration-300"/>
            <circle cx="100" cy="100" r="74" fill="none" stroke="#31353c" stroke-width="10"/>
            <circle id="interval-ring" cx="100" cy="100" r="74" fill="none" stroke="#c3f400" stroke-width="10" stroke-dasharray="464.95" stroke-dashoffset="0" class="transition-all duration-300"/>
          </svg>

          <div class="absolute flex flex-col items-center text-center">
            <span id="hud-phase-label" class="text-[10px] uppercase tracking-wider text-on-surface-variant font-bold font-mono">Work Phase</span>
            <span id="interval-digits" class="text-5xl font-extrabold text-white tracking-tighter my-0.5 font-mono">1:00</span>
            <div id="hud-sound-pill" class="flex items-center gap-1 px-2.5 py-0.5 rounded bg-primary-container text-on-primary text-[9px] uppercase font-black font-mono">
              <span class="material-symbols-outlined text-[12px] font-bold">volume_up</span>
              <span id="hud-cue-type">STADIUM BOOM</span>
            </div>
          </div>
        </div>

        <div class="w-full grid grid-cols-2 gap-2 bg-surface-container rounded-lg p-2.5 border border-surface-high text-xs font-mono">
          <div>
            <span class="text-[9px] uppercase text-on-surface-variant block font-bold">Session Elapsed</span>
            <span id="session-elapsed" class="text-base font-bold text-white">00:00</span>
          </div>
          <div class="text-right">
            <span class="text-[9px] uppercase text-on-surface-variant block font-bold">Session Remaining</span>
            <span id="session-remaining" class="text-base font-bold text-primary-container">10:00</span>
          </div>
        </div>
      </div>

      <div class="bg-surface-container rounded-xl p-3 border border-surface-high flex flex-col gap-1.5">
        <div class="flex justify-between items-center text-[10px] font-mono">
          <span class="font-bold uppercase text-white">Interval Cadence Progression</span>
          <span class="text-secondary-container font-bold uppercase flex items-center gap-1">
            <span class="w-1.5 h-1.5 rounded-full bg-secondary-container animate-pulse"></span>
            Finale Alert
          </span>
        </div>
        <div id="interval-grid" class="grid grid-cols-10 gap-1 w-full pt-1"></div>
      </div>

      <!-- Main Start / Pause Controls -->
      <div class="grid grid-cols-4 gap-2 pt-1">
        <button id="btn-timer-toggle" onclick="toggleTimer()" type="button" class="col-span-3 h-14 bg-primary-container active:scale-95 text-on-primary rounded-xl flex items-center justify-center gap-2 shadow-lg transition-transform cursor-pointer">
          <span id="btn-timer-icon" class="material-symbols-outlined text-[28px] font-bold">play_arrow</span>
          <span id="btn-timer-text" class="text-base font-black uppercase tracking-wide">Start Drill</span>
        </button>
        <button onclick="skipInterval()" type="button" class="col-span-1 h-14 bg-surface-container active:bg-surface-high border border-surface-highest text-white rounded-xl flex flex-col items-center justify-center active:scale-95 cursor-pointer">
          <span class="material-symbols-outlined text-[22px]">skip_next</span>
          <span class="text-[8px] uppercase font-bold text-on-surface-variant font-mono">Skip</span>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <button onc
